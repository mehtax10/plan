<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Shift Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue:#1a56a0; --blue-dark:#0f3d7a; --blue-light:#e8f0fb;
    --teal:#0e8a86; --teal-light:#e2f5f4;
    --orange:#e07b10; --orange-light:#fdeee0;
    --purple:#6a3fa0; --purple-light:#f1e9fb;
    --gray:#5a6b82; --gray-light:#eef1f6;
    --gray-bg:#f0f3f8; --card-bg:#ffffff;
    --border:#d0dae8; --text:#1a2535; --muted:#6b7e99;
    --red:#c0392b; --red-light:#fdecea;
    --radius:12px; --shadow:0 2px 12px rgba(30,60,120,0.10);
  }
  body { font-family:'Barlow',sans-serif; background:var(--gray-bg); color:var(--text); min-height:100vh; padding:0 0 32px; }
  header { background:linear-gradient(135deg,var(--blue-dark) 0%,var(--blue) 100%); color:#fff; text-align:center; padding:20px 24px 16px; box-shadow:0 4px 20px rgba(15,61,122,0.25); position:relative; }
  header h1 { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; }
  header p { font-size:13px; opacity:0.75; margin-top:3px; }
  .last-updated { font-size:11px; opacity:0.6; margin-top:4px; }
  .refresh-btn { position:absolute; right:20px; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.35); color:#fff; border-radius:8px; padding:6px 14px; font-family:'Barlow',sans-serif; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; transition:background 0.2s; }
  .refresh-btn:hover { background:rgba(255,255,255,0.25); }
  .refresh-btn.spinning .icon { display:inline-block; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading-overlay { position:fixed; inset:0; background:rgba(15,40,80,0.55); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; color:#fff; gap:14px; }
  #loading-overlay.hidden { display:none; }
  .spinner { width:44px; height:44px; border:4px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
  #loading-overlay p { font-size:15px; font-weight:600; opacity:0.9; }
  #error-banner { background:#fdecea; border:1px solid #f5c6c2; color:#c0392b; border-radius:8px; padding:12px 16px; margin:16px; font-size:13px; display:none; white-space:pre-wrap; }
  #error-banner.show { display:block; }
  .main { max-width:1600px; margin:0 auto; padding:20px 16px 0; }

  .week-nav { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:16px; }
  .week-nav button { background:var(--card-bg); border:1px solid var(--border); border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:15px; color:var(--blue); box-shadow:var(--shadow); }
  .week-nav button:hover { background:var(--blue-light); }
  .week-nav .week-label { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:800; color:var(--blue-dark); min-width:220px; text-align:center; }
  .week-nav .today-btn { font-family:'Barlow',sans-serif; font-size:12px; font-weight:600; width:auto; padding:0 12px; height:30px; }

  .settings-bar { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 18px; margin-bottom:16px; display:flex; gap:18px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); }
  .settings-bar strong { color:var(--text); }
  .settings-bar .divider { width:1px; height:16px; background:var(--border); }
  .legend-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }

  .week-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:14px; align-items:start; }
  .day-col { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; }
  .day-col.is-today { outline:2px solid var(--blue); outline-offset:-2px; }
  .day-head { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:#fff; padding:12px 14px; text-align:center; }
  .day-col.is-today .day-head { background:linear-gradient(135deg,#c06800,var(--orange)); }
  .day-name { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:1px; }
  .day-date { font-size:11px; opacity:0.85; margin-top:1px; }
  .day-summary { padding:8px 14px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; background:var(--gray-light); }
  .day-summary .over { color:var(--red); font-weight:700; }

  .section-label { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); padding:10px 12px 4px; }
  .coming-in { padding:0 10px 6px; display:flex; flex-direction:column; gap:5px; }
  .coming-in-empty { font-size:11px; color:var(--muted); padding:2px 2px 8px; }
  .coming-chip { background:var(--purple-light); border-left:3px solid var(--purple); border-radius:6px; padding:6px 8px; font-size:11px; }
  .coming-chip .cc-top { font-weight:700; color:var(--text); display:flex; justify-content:space-between; gap:6px; }
  .coming-chip .cc-time { color:var(--purple); font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:12px; }
  .coming-chip .cc-meta { color:var(--muted); font-size:10.5px; margin-top:1px; }

  .day-body { padding:6px 10px 10px; display:flex; flex-direction:column; gap:6px; min-height:50px; }
  .empty-day { text-align:center; color:var(--muted); font-size:12px; padding:14px 6px; }

  .block { border-radius:8px; padding:8px 10px 8px 26px; border-left:4px solid var(--gray); background:var(--gray-light); position:relative; transition:box-shadow 0.15s, opacity 0.15s; }
  .block .time { font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:800; color:var(--text); }
  .block .label { font-size:12px; font-weight:600; margin-top:1px; }
  .block .meta { font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .block.fixed { border-left-color:var(--gray); background:var(--gray-light); }
  .block.c40 { border-left-color:var(--blue); background:var(--blue-light); }
  .block.c20 { border-left-color:var(--teal); background:var(--teal-light); }
  .block.loose { border-left-color:var(--orange); background:var(--orange-light); }
  .block .tag { display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; padding:1px 6px; border-radius:20px; margin-top:3px; }
  .block.c40 .tag { background:var(--blue); color:#fff; }
  .block.c20 .tag { background:var(--teal); color:#fff; }
  .block.loose .tag { background:var(--orange); color:#fff; }
  .block.fixed .tag { background:var(--gray); color:#fff; }
  .block.locked { padding-left:10px; }
  .block.locked .lock-note { font-size:9.5px; color:var(--muted); margin-top:3px; }
  .block[draggable="true"] { cursor:grab; }
  .block[draggable="true"]:hover { box-shadow:0 2px 8px rgba(30,60,120,0.18); }
  .block[draggable="true"]:active { cursor:grabbing; }
  .block[draggable="true"]::before {
    content:'⠿'; position:absolute; left:8px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:13px; line-height:1;
  }
  .block.dragging { opacity:0.35; }

  .overflow-box { margin:6px 10px 10px; padding:8px 10px; background:var(--red-light); border:1px solid #f5c6c2; border-radius:8px; }
  .overflow-box .oh { font-size:10.5px; font-weight:700; color:var(--red); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; }
  .overflow-box .item { font-size:11px; color:var(--text); margin-bottom:2px; }

  @media (max-width:1100px) {
    .week-grid { grid-template-columns:1fr 1fr; }
  }
  @media (max-width:700px) {
    .week-grid { grid-template-columns:1fr; }
    .refresh-btn span { display:none; }
  }
</style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><p>Fetching live data from Google Sheets…</p></div>
<div id="error-banner"></div>
<header>
  <h1>🗓️ Weekly Shift Planner</h1>
  
  <div class="last-updated" id="last-updated"></div>
  <button class="refresh-btn" id="refresh-btn" onclick="loadAll()"><span class="icon">↻</span> <span>Refresh</span></button>
</header>
<div class="main">
  <div class="week-nav">
    <button id="prev-week">&#8249;</button>
    <div class="week-label" id="week-label">—</div>
    <button id="next-week">&#8250;</button>
    <button class="today-btn" id="today-week-btn">This Week</button>
  </div>

  <div class="settings-bar">
    <div>Shift: <strong id="shift-hours-label">—</strong></div>
    <div class="divider"></div>
    <div>40' container: <strong>1 hr flat</strong></div>
    <div class="divider"></div>
    <div>20' container: <strong>30 min flat</strong> <span style="opacity:.7">(assumed — tell me if wrong)</span></div>
    <div class="divider"></div>
    <div>Loose (L): <strong>70 ctns/hr</strong></div>
    <div class="divider"></div>
    <div><span class="legend-dot" style="background:var(--blue)"></span>40' &nbsp; <span class="legend-dot" style="background:var(--teal)"></span>20' &nbsp; <span class="legend-dot" style="background:var(--orange)"></span>Loose &nbsp; <span class="legend-dot" style="background:var(--gray)"></span>Routine &nbsp; <span class="legend-dot" style="background:var(--purple)"></span>Coming In</div>
  </div>

  <div class="week-grid" id="week-grid"></div>
</div>

<script>
// ── ENCRYPTED CONFIG (same source as Inbound Planning Dashboard) ─────────────
var _ENC = '211a161f06544b6b051c0b411e555a26090e0a5b0d0b294e0018405553513a06070a011d4b204e16470060737611435319215a013e064122414971782537062a361d0b1259365f1f1d6764043e51264634532100055e5a6a0043055e0e1e38312c0d1626300347417d2e1e313619055009272b30615c5d6a7e2d0a192f0b2a6b11060a0d5f4741391b1652161d12';
var _KEY = 'InboundDash2025';
function _xd(h,k){var d='';for(var i=0;i<h.length;i+=2){d+=String.fromCharCode(parseInt(h.substr(i,2),16)^k.charCodeAt((i/2)%k.length));}return d;}
var SHEET_URL = _xd(_ENC, _KEY);

// ── DYNAMIC COLUMN DETECTION ──────────────────────────────────────────────────
// Reads the header row and finds each column by name, instead of a hardcoded
// position — so this keeps working if the sheet's column order ever changes.
var COLS = null; // populated by detectColumns() after the first successful load
function findCol(headers, patterns, taken){
  for(var p=0;p<patterns.length;p++){
    for(var i=0;i<headers.length;i++){
      if(taken.indexOf(i)!==-1) continue;
      if(headers[i].indexOf(patterns[p]) !== -1) return i;
    }
  }
  return -1;
}
function detectColumns(headerRow){
  var headers = headerRow.map(function(h){ return (h||'').toUpperCase(); });
  var taken = [];
  function pick(patterns){ var idx = findCol(headers, patterns, taken); if(idx!==-1) taken.push(idx); return idx; }
  var c = {};
  c.client    = pick(['CLIENT','ACCOUNT','CUSTOMER']);
  c.container = pick(['CONTAINER']);
  c.size      = pick(['SIZE']);
  c.door      = pick(['DOOR']);
  c.carrier   = pick(['CARRIER']);
  c.appt      = pick(['APPT']);
  c.cartons   = pick(['CARTON']);
  c.skus      = pick(['SKU']);
  c.declared  = pick(['DECLARED']);
  c.lumpers   = pick(['LUMPER','HANDLED BY','HANDLED']);
  c.notes     = pick(['NOTE','COMMENT']);
  return c;
}

// ── ADJUSTABLE PLANNING CONSTANTS ────────────────────────────────────────────
var SHIFT_START      = '07:00';
var SHIFT_END        = '15:30';
var FIXED_BLOCKS = [
  { start:'07:00', end:'07:10', label:'Morning Meeting' },
  { start:'09:00', end:'09:15', label:'Break' },
  { start:'12:00', end:'12:30', label:'Lunch' },
  { start:'15:20', end:'15:30', label:'Wrap-Up' }
];
var CONTAINER_40_HOURS   = 1;    // flat hours to offload a 40' (full) container
var CONTAINER_20_HOURS   = 0.5;  // flat hours to offload a 20' container — assumption, adjust if wrong
var LOOSE_CTNS_PER_HOUR  = 70;   // cartons sorted per hour for loose (L) freight
var LOOSE_FALLBACK_MIN   = 30;   // used only if a loose row has no readable carton count

// ── STATE ────────────────────────────────────────────────────────────────────
var rawRecords = [];
var _t = new Date();
var TODAY = new Date(_t.getFullYear(), _t.getMonth(), _t.getDate());
var TODAY_STR = ds(TODAY);
var weekOffset = 0;
var manualOrder = {};
var draggedEl = null;
var draggedDay = null;

// ── UTILS ────────────────────────────────────────────────────────────────────
function ds(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return String(n).padStart(2,'0'); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toMin(hhmm){ var p=hhmm.split(':'); return (+p[0])*60+(+p[1]); }
function fmtMin(mins){
  if(mins==null) return '';
  var h=Math.floor(mins/60), m=mins%60;
  var ap = h>=12 ? 'PM' : 'AM';
  var h12 = h%12; if(h12===0) h12=12;
  return h12+':'+pad(m)+' '+ap;
}
function fmtDur(mins){
  mins = Math.max(0, Math.round(mins));
  var h=Math.floor(mins/60), m=mins%60;
  if(h>0 && m>0) return h+'h '+m+'m';
  if(h>0) return h+'h';
  return m+'m';
}
function getMonday(d){
  var day = d.getDay();
  var diff = (day===0 ? -6 : 1-day);
  var mon = new Date(d);
  mon.setDate(d.getDate()+diff);
  mon.setHours(0,0,0,0);
  return mon;
}

function extractCartons(raw){
  if(!raw) return null;
  raw=raw.trim();
  var inner=raw.match(/\((\d[\d,]*)\s*ctns?\)/i);
  if(inner) return parseInt(inner[1].replace(/,/g,''));
  var lead=raw.match(/(\d[\d,]*)/);
  if(lead) return parseInt(lead[1].replace(/,/g,''));
  return null;
}
// Classifies a row using the SIZE column: 40 = full container, 20 = small
// container, "L" = loose freight. Falls back to scanning the cartons cell
// text if SIZE is blank or unrecognized.
function classifySize(sizeRaw, cartonRaw){
  var s = (sizeRaw||'').toString().toUpperCase().trim();
  if(s){
    if(/^L\b/.test(s) || s==='L' || s.indexOf('LOOSE')!==-1) return 'loose';
    if(s.indexOf('40')!==-1) return 'c40';
    if(s.indexOf('20')!==-1) return 'c20';
  }
  var c = (cartonRaw||'').toUpperCase();
  if(c.indexOf('LOOSE')!==-1 || c.indexOf('FLOOR')!==-1) return 'loose';
  if(c.indexOf('40')!==-1) return 'c40';
  if(c.indexOf('20')!==-1) return 'c20';
  return 'unknown';
}

// ── CSV PARSER ───────────────────────────────────────────────────────────────
function csvToLines(text){
  var lines=[],cur='',inQ=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(ch==='"'){inQ=!inQ;cur+=ch;}
    else if((ch==='\n'||ch==='\r')&&!inQ){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      lines.push(cur);cur='';
    }else{cur+=ch;}
  }
  if(cur)lines.push(cur);
  return lines;
}
function splitLine(line){
  var cells=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){cells.push(cur);cur='';}
    else{cur+=ch;}
  }
  cells.push(cur);
  return cells.map(function(c){return c.trim().replace(/^"|"$/g,'').replace(/[\r\n]+/g,' ').trim();});
}
function parseDate(raw){
  if(!raw)return null;
  raw=raw.replace(/^["'\s]+|["'\s]+$/g,'').replace(/[\r\n]+/g,' ');
  if(!raw)return null;
  raw=raw.replace(/\s+\d{1,2}:\d{2}(:\d{2})?(\s*(AM|PM))?$/i,'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;
  var s=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(s)return s[3]+'-'+pad(s[1])+'-'+pad(s[2]);
  var m=raw.match(/^(\d{1,2})[\/\-]([A-Za-z]{3})[\/\-](\d{2,4})$/);
  if(m){
    var mo={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'}[m[2].toLowerCase()];
    if(mo){var y=m[3];if(y.length===2)y=(parseInt(y)>50?'19':'20')+y;return y+'-'+mo+'-'+pad(m[1]);}
  }
  var n=parseInt(raw);
  if(!isNaN(n)&&n>40000&&n<60000){var d=new Date(1899,11,30);d.setDate(d.getDate()+n);return ds(d);}
  return null;
}
function parseApptTime(raw){
  if(!raw) return null;
  var m = raw.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m) return null;
  var h = parseInt(m[1],10), mins = parseInt(m[2],10), ap = m[3];
  if(ap){
    ap = ap.toUpperCase();
    if(ap==='PM' && h!==12) h+=12;
    if(ap==='AM' && h===12) h=0;
  } else if(h < 5){
    h += 12;
  }
  return h*60+mins;
}

// ── LOAD DATA ────────────────────────────────────────────────────────────────
function loadAll(){
  showLoading(true); hideError();
  document.getElementById('refresh-btn').classList.add('spinning');
  fetch(SHEET_URL+'&_='+Date.now())
    .then(function(res){
      if(!res.ok)throw new Error('HTTP '+res.status);
      return res.text();
    })
    .then(function(text){
      if(!text||text.length<10)throw new Error('Empty response.');
      var lines=csvToLines(text);
      if(lines.length<2) throw new Error('No data rows found.');
      var headerRow = splitLine(lines[0]);
      COLS = detectColumns(headerRow);
      if(COLS.declared===-1 || COLS.appt===-1){
        showError('Could not find "Appt Date" and/or "Date Declared" columns in the sheet header. Found headers: '+headerRow.join(' | '));
      }
      rawRecords=lines.slice(1).map(function(l){return splitLine(l);}).filter(function(r){return!r.every(function(c){return!c;});});
      document.getElementById('last-updated').textContent='Last updated: '+new Date().toLocaleTimeString();
      renderWeek();
    })
    .catch(function(e){
      showError('Could not load data: '+e.message);
      console.error(e);
    })
    .finally(function(){
      showLoading(false);
      document.getElementById('refresh-btn').classList.remove('spinning');
    });
}
function showLoading(v){document.getElementById('loading-overlay').classList.toggle('hidden',!v);}
function showError(msg){var b=document.getElementById('error-banner');b.textContent=msg;b.classList.add('show');}
function hideError(){document.getElementById('error-banner').classList.remove('show');}

// ── DATA SHAPING ──────────────────────────────────────────────────────────────
function rowToTask(row, uidPrefix, idx){
  var cartonRaw = COLS.cartons!==-1 ? (row[COLS.cartons]||'') : '';
  var sizeRaw   = COLS.size!==-1 ? (row[COLS.size]||'') : '';
  var kind = classifySize(sizeRaw, cartonRaw);
  var cartons = extractCartons(cartonRaw);
  var apptRaw = COLS.appt!==-1 ? (row[COLS.appt]||'') : '';
  var apptDate = parseDate(apptRaw);
  var apptTimeMin = parseApptTime(apptRaw);
  var durationMin;
  if(kind==='c40') durationMin = CONTAINER_40_HOURS*60;
  else if(kind==='c20') durationMin = CONTAINER_20_HOURS*60;
  else durationMin = cartons ? Math.round(cartons/LOOSE_CTNS_PER_HOUR*60) : LOOSE_FALLBACK_MIN;
  return {
    uid: uidPrefix+'_'+idx,
    container: COLS.container!==-1 ? (row[COLS.container]||'—') : '—',
    client: COLS.client!==-1 ? (row[COLS.client]||'—') : '—',
    door: COLS.door!==-1 ? (row[COLS.door]||'') : '',
    lumpers: COLS.lumpers!==-1 ? (row[COLS.lumpers]||'') : '',
    cartons: cartons,
    kind: kind,
    durationMin: durationMin,
    apptDate: apptDate,
    apptTimeMin: apptTimeMin
  };
}

function buildComingIn(dateStr){
  if(!COLS || COLS.appt===-1) return [];
  var rows = rawRecords.filter(function(row){ return parseDate(row[COLS.appt]||'') === dateStr; });
  return rows.map(function(row,i){ return rowToTask(row, 'in_'+dateStr, i); })
    .sort(function(a,b){ var ta=a.apptTimeMin==null?9999:a.apptTimeMin, tb=b.apptTimeMin==null?9999:b.apptTimeMin; return ta-tb; });
}

function buildPlannedTasks(dateStr){
  if(!COLS || COLS.declared===-1) return [];
  var rows = rawRecords.filter(function(row){ return parseDate(row[COLS.declared]||'') === dateStr; });
  return rows.map(function(row,i){ return rowToTask(row, 'wk_'+dateStr, i); });
}

// ── SCHEDULING (Date Declared tasks only) ────────────────────────────────────
function computeGaps(anchored, shiftStartMin, shiftEndMin){
  var sorted = anchored.slice().sort(function(a,b){ return a.start-b.start; });
  var gaps = [];
  var cursor = shiftStartMin;
  sorted.forEach(function(a){
    if(a.start > cursor) gaps.push({ start:cursor, end:a.start });
    cursor = Math.max(cursor, a.end);
  });
  if(cursor < shiftEndMin) gaps.push({ start:cursor, end:shiftEndMin });
  return gaps.filter(function(g){ return g.end > g.start; });
}
function placeUnanchored(tasks, gaps){
  var placed = [];
  var overflow = [];
  var gapIdx = 0;
  var cursor = gaps.length ? gaps[0].start : null;
  tasks.forEach(function(t){
    while(gapIdx < gaps.length && (cursor===null || cursor + t.durationMin > gaps[gapIdx].end)){
      gapIdx++;
      cursor = gapIdx < gaps.length ? gaps[gapIdx].start : null;
    }
    if(gapIdx >= gaps.length || cursor===null){
      overflow.push(t);
      return;
    }
    var start = cursor, end = cursor + t.durationMin;
    placed.push(Object.assign({}, t, { start:start, end:end, locked:false }));
    cursor = end;
  });
  return { placed:placed, overflow:overflow };
}
function scheduleDay(dateStr){
  var shiftStartMin = toMin(SHIFT_START);
  var shiftEndMin = toMin(SHIFT_END);

  var tasks = buildPlannedTasks(dateStr);
  tasks.sort(function(a,b){
    var order = { c40:0, c20:1, loose:2, unknown:2 };
    return (order[a.kind]||2) - (order[b.kind]||2);
  });

  var anchored = FIXED_BLOCKS.map(function(b){
    return { start: toMin(b.start), end: toMin(b.end), label:b.label, kind:'fixed', locked:true };
  });
  var anchoredTasks = [];
  var unanchoredTasks = [];
  tasks.forEach(function(t){
    if(t.apptTimeMin !== null && t.apptDate === dateStr && t.apptTimeMin >= shiftStartMin && t.apptTimeMin <= shiftEndMin){
      anchoredTasks.push(Object.assign({}, t, { start:t.apptTimeMin, end:t.apptTimeMin+t.durationMin, locked:true }));
    } else {
      unanchoredTasks.push(t);
    }
  });

  var order = manualOrder[dateStr];
  if(order && order.length){
    var pos = {};
    order.forEach(function(uid,i){ pos[uid]=i; });
    unanchoredTasks.sort(function(a,b){
      var pa = pos[a.uid]!==undefined ? pos[a.uid] : 999;
      var pb = pos[b.uid]!==undefined ? pos[b.uid] : 999;
      return pa-pb;
    });
  }

  var allAnchored = anchored.concat(anchoredTasks.map(function(t){ return { start:t.start, end:t.end }; }));
  var gaps = computeGaps(allAnchored, shiftStartMin, shiftEndMin);
  var result = placeUnanchored(unanchoredTasks, gaps);

  var timeline = anchored.concat(anchoredTasks, result.placed);
  timeline.sort(function(a,b){ return a.start-b.start; });

  var totalTaskMin = tasks.reduce(function(s,t){ return s+t.durationMin; },0);
  var availableMin = gaps.reduce(function(s,g){ return s+(g.end-g.start); },0) + anchoredTasks.reduce(function(s,t){return s+(t.end-t.start);},0);

  return { timeline:timeline, overflow:result.overflow, totalTaskMin:totalTaskMin, availableMin:availableMin, taskCount:tasks.length };
}

// ── RENDER ────────────────────────────────────────────────────────────────────
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var KIND_LABEL = { c40:"40' Container", c20:"20' Container", loose:'Loose Freight', unknown:'Freight' };

function renderWeek(){
  var monday = getMonday(addDays(TODAY, weekOffset*7));
  var friday = addDays(monday,4);
  document.getElementById('week-label').textContent =
    MONTHS_SHORT[monday.getMonth()]+' '+monday.getDate()+' – '+MONTHS_SHORT[friday.getMonth()]+' '+friday.getDate()+', '+friday.getFullYear();
  document.getElementById('shift-hours-label').textContent = fmtMin(toMin(SHIFT_START))+' – '+fmtMin(toMin(SHIFT_END));

  var grid = document.getElementById('week-grid');
  grid.innerHTML = '';

  if(!COLS) return;

  for(var i=0;i<5;i++){
    var d = addDays(monday, i);
    var dateStr = ds(d);
    var sched = scheduleDay(dateStr);
    var comingIn = buildComingIn(dateStr);

    var col = document.createElement('div');
    col.className = 'day-col' + (dateStr===TODAY_STR ? ' is-today' : '');

    var overPct = sched.totalTaskMin > sched.availableMin;
    col.innerHTML =
      '<div class="day-head">'
        +'<div class="day-name">'+DOW[d.getDay()]+'</div>'
        +'<div class="day-date">'+MONTHS_SHORT[d.getMonth()]+' '+d.getDate()+'</div>'
      +'</div>'
      +'<div class="section-label">📦 Coming In</div>'
      +'<div class="coming-in" id="coming-'+i+'"></div>'
      +'<div class="section-label">🛠 Planned Work</div>'
      +'<div class="day-summary">'
        +'<span>'+sched.taskCount+' task'+(sched.taskCount===1?'':'s')+'</span>'
        +'<span class="'+(overPct?'over':'')+'">'+fmtDur(sched.totalTaskMin)+' / '+fmtDur(sched.availableMin)+' avail'+(overPct?' ⚠':'')+'</span>'
      +'</div>'
      +'<div class="day-body" id="body-'+i+'"></div>';

    grid.appendChild(col);

    // Coming In list (informational, not time-boxed)
    var comingBox = col.querySelector('#coming-'+i);
    if(!comingIn.length){
      comingBox.innerHTML = '<div class="coming-in-empty">Nothing scheduled to arrive.</div>';
    } else {
      comingIn.forEach(function(t){
        var chip = document.createElement('div');
        chip.className = 'coming-chip';
        var qty = t.kind==='loose' ? (t.cartons ? t.cartons.toLocaleString()+' ctns (loose)' : 'loose freight')
                                    : (KIND_LABEL[t.kind]||'freight');
        chip.innerHTML = '<div class="cc-top"><span>'+esc(t.container)+' — '+esc(t.client)+'</span>'
          +(t.apptTimeMin!=null ? '<span class="cc-time">'+fmtMin(t.apptTimeMin)+'</span>' : '')+'</div>'
          +'<div class="cc-meta">'+esc(qty)+'</div>';
        comingBox.appendChild(chip);
      });
    }

    // Planned Work timeline
    var body = col.querySelector('.day-body');
    if(sched.taskCount===0){
      var note = document.createElement('div');
      note.className = 'empty-day';
      note.textContent = 'No work declared for this date — routine only.';
      body.appendChild(note);
    }
    sched.timeline.forEach(function(ev){
      var el = document.createElement('div');
      if(ev.kind==='fixed'){
        el.className = 'block fixed locked';
        el.innerHTML = '<div class="time">'+fmtMin(ev.start)+' – '+fmtMin(ev.end)+'</div>'
          +'<div class="label">'+esc(ev.label)+'</div>'
          +'<span class="tag">Routine</span>';
      } else {
        var cls = ev.kind==='c40' ? 'c40' : ev.kind==='c20' ? 'c20' : 'loose';
        var qtyLine = ev.kind==='loose'
          ? (ev.cartons ? ev.cartons.toLocaleString()+' ctns to sort' : 'Qty unknown — est. '+fmtDur(ev.durationMin))
          : (KIND_LABEL[ev.kind]||'Container')+' offload';
        el.className = 'block '+cls+(ev.locked?' locked':'');
        el.innerHTML = '<div class="time">'+fmtMin(ev.start)+' – '+fmtMin(ev.end)+' &nbsp;('+fmtDur(ev.durationMin)+')</div>'
          +'<div class="label">'+esc(ev.container)+' — '+esc(ev.client)+'</div>'
          +'<div class="meta">'+esc(qtyLine)+(ev.door?' &middot; Door '+esc(ev.door):'')+(ev.lumpers?' &middot; '+esc(ev.lumpers):'')+'</div>'
          +'<span class="tag">'+(KIND_LABEL[ev.kind]||'Freight')+'</span>'
          +(ev.locked ? '<div class="lock-note">🔒 Pinned to appt time</div>' : '');
        if(!ev.locked){
          el.draggable = true;
          el.dataset.uid = ev.uid;
          el.dataset.day = dateStr;
          el.addEventListener('dragstart', onDragStart);
          el.addEventListener('dragend', onDragEnd);
        }
      }
      body.appendChild(el);
    });
    body.dataset.day = dateStr;
    body.addEventListener('dragover', onDragOver);
    body.addEventListener('drop', onDrop);

    if(sched.overflow.length){
      var ov = document.createElement('div');
      ov.className = 'overflow-box';
      ov.innerHTML = '<div class="oh">⚠ Doesn\'t fit in shift ('+sched.overflow.length+')</div>'
        + sched.overflow.map(function(t){
            var qty = t.kind!=='loose' ? (KIND_LABEL[t.kind]||'container') : (t.cartons ? t.cartons.toLocaleString()+' ctns' : 'qty unknown');
            return '<div class="item">'+esc(t.container)+' — '+esc(t.client)+' ('+qty+', '+fmtDur(t.durationMin)+')</div>';
          }).join('');
      col.appendChild(ov);
    }
  }
}

// ── DRAG & DROP REORDERING (auto-placed task blocks only) ───────────────────
function onDragStart(e){
  draggedEl = e.currentTarget;
  draggedDay = e.currentTarget.dataset.day;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', e.currentTarget.dataset.uid); } catch(err){}
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  draggedEl = null;
  draggedDay = null;
}
function getDragAfterElement(container, y){
  var els = [].slice.call(container.querySelectorAll('.block[draggable="true"]:not(.dragging)'));
  return els.reduce(function(closest, child){
    var box = child.getBoundingClientRect();
    var offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset){
      return { offset:offset, element:child };
    }
    return closest;
  }, { offset:-Infinity, element:null }).element;
}
function onDragOver(e){
  if(!draggedEl || this.dataset.day !== draggedDay) return;
  e.preventDefault();
  var after = getDragAfterElement(this, e.clientY);
  if(after == null){
    this.appendChild(draggedEl);
  } else {
    this.insertBefore(draggedEl, after);
  }
}
function onDrop(e){
  if(!draggedEl || this.dataset.day !== draggedDay) return;
  e.preventDefault();
  var dateStr = this.dataset.day;
  var order = [].slice.call(this.querySelectorAll('.block[draggable="true"]')).map(function(el){ return el.dataset.uid; });
  manualOrder[dateStr] = order;
  renderWeek();
}

document.getElementById('prev-week').addEventListener('click', function(){ weekOffset--; renderWeek(); });
document.getElementById('next-week').addEventListener('click', function(){ weekOffset++; renderWeek(); });
document.getElementById('today-week-btn').addEventListener('click', function(){ weekOffset=0; renderWeek(); });

loadAll();
setInterval(loadAll, 5*60*1000);
